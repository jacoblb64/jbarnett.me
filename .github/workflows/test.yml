name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  e2e:
    # Pinned macOS to match the committed screenshot baselines (generated on macOS).
    # Pinning (rather than macos-latest) keeps text rasterization stable across runs;
    # bumping the runner image means regenerating test/__snapshots__/**/*.png.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test/playwright-report
            test/test-results
          retention-days: 14
