name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  e2e:
    # macOS to match the committed screenshot baselines, which were generated on macOS.
    # Switching runners means regenerating test/__snapshots__/**/*.png on that platform.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test/playwright-report
            test/test-results
          retention-days: 14
